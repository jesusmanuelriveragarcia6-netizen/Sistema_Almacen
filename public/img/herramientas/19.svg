<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#0a192f"/>
  <text x="100" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#64ffda" font-weight="bold">PISTOLA DE SOLDAR</text>
  <!-- Handle -->
  <path d="M105 150 Q100 155 90 158 L75 158 Q65 158 63 150 L63 120 Q63 112 70 110 L95 108 Q105 108 107 116 Z" fill="#37474f"/>
  <path d="M103 148 Q99 152 90 155 L77 155 Q68 155 66 148 L66 122 Q66 115 72 113 L94 111 Q103 111 105 118 Z" fill="#455a64"/>
  <!-- Trigger -->
  <path d="M80 130 L90 130 L90 145 L80 145 Z" rx="3" fill="#263238"/>
  <rect x="81" y="131" width="8" height="12" rx="2" fill="#e53935"/>
  <!-- Gun body/barrel -->
  <rect x="95" y="90" width="75" height="28" rx="6" fill="#546e7a"/>
  <rect x="98" y="93" width="69" height="22" rx="4" fill="#607d8b"/>
  <!-- Heating coil area -->
  <rect x="140" y="88" width="28" height="32" rx="4" fill="#455a64"/>
  <!-- Tip -->
  <polygon points="168,95 185,104 168,113" fill="#90a4ae"/>
  <polygon points="183,102 195,104 183,106" fill="#b0bec5"/>
  <!-- Heat glow at tip -->
  <ellipse cx="193" cy="104" rx="6" ry="3" fill="rgba(255,152,0,0.4)"/>
  <ellipse cx="196" cy="104" rx="3" ry="2" fill="rgba(255,87,34,0.6)"/>
  <!-- Sparks/welding effect -->
  <line x1="192" y1="100" x2="198" y2="94" stroke="#ffcc00" stroke-width="1.5"/>
  <line x1="194" y1="102" x2="200" y2="98" stroke="#ff9800" stroke-width="1"/>
  <line x1="193" y1="107" x2="200" y2="112" stroke="#ffcc00" stroke-width="1.5"/>
  <line x1="195" y1="105" x2="202" y2="108" stroke="#ff9800" stroke-width="1"/>
  <!-- Cord -->
  <path d="M65 135 Q40 135 35 150 Q30 165 35 178" stroke="#263238" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M65 135 Q40 135 35 150 Q30 165 35 178" stroke="#37474f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Ventilation slots -->
  <rect x="100" y="97" width="3" height="16" rx="1" fill="#37474f"/>
  <rect x="107" y="97" width="3" height="16" rx="1" fill="#37474f"/>
  <rect x="114" y="97" width="3" height="16" rx="1" fill="#37474f"/>
  <text x="100" y="192" text-anchor="middle" font-family="Arial" font-size="10" fill="#8892b0">Pistola Soldadora Eléctrica</text>
</svg>
