<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#0a192f"/>
  <text x="100" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#64ffda" font-weight="bold">CINTA MÉTRICA 5M</text>
  <!-- Tape measure body -->
  <rect x="50" y="55" width="100" height="85" rx="14" fill="#f9a825"/>
  <rect x="55" y="60" width="90" height="75" rx="10" fill="#ffb300"/>
  <!-- Logo area -->
  <rect x="65" y="70" width="70" height="35" rx="6" fill="#e65100"/>
  <text x="100" y="92" text-anchor="middle" font-family="Arial" font-size="14" fill="white" font-weight="bold">5m</text>
  <!-- Belt clip -->
  <rect x="130" y="55" width="10" height="85" rx="3" fill="#78909c"/>
  <rect x="135" y="50" width="6" height="10" rx="2" fill="#607d8b"/>
  <!-- Lock button -->
  <rect x="63" y="118" width="28" height="14" rx="4" fill="#e53935"/>
  <text x="77" y="128" text-anchor="middle" font-family="Arial" font-size="7" fill="white">LOCK</text>
  <!-- Extended tape -->
  <rect x="20" y="93" width="35" height="12" rx="2" fill="#fff9c4"/>
  <!-- Tape markings -->
  <line x1="25" y1="93" x2="25" y2="105" stroke="#f57f17" stroke-width="1"/>
  <line x1="30" y1="96" x2="30" y2="105" stroke="#f57f17" stroke-width="0.5"/>
  <line x1="35" y1="93" x2="35" y2="105" stroke="#f57f17" stroke-width="1"/>
  <line x1="40" y1="96" x2="40" y2="105" stroke="#f57f17" stroke-width="0.5"/>
  <line x1="45" y1="93" x2="45" y2="105" stroke="#f57f17" stroke-width="1"/>
  <text x="28" y="102" font-family="Arial" font-size="5" fill="#e65100">10</text>
  <text x="38" y="102" font-family="Arial" font-size="5" fill="#e65100">20</text>
  <!-- Hook -->
  <rect x="17" y="92" width="6" height="14" rx="1" fill="#90a4ae"/>
  <text x="100" y="192" text-anchor="middle" font-family="Arial" font-size="10" fill="#8892b0">Cinta Metálica Flexómetro</text>
</svg>
