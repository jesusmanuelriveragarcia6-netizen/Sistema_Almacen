<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#0a192f"/>
  <text x="100" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#64ffda" font-weight="bold">GATO HIDRÁULICO TRUPER</text>
  <!-- Base plate -->
  <rect x="25" y="158" width="150" height="16" rx="5" fill="#37474f"/>
  <!-- Wheels -->
  <circle cx="48" cy="174" r="9" fill="#263238"/><circle cx="48" cy="174" r="5" fill="#37474f"/>
  <circle cx="152" cy="174" r="9" fill="#263238"/><circle cx="152" cy="174" r="5" fill="#37474f"/>
  <circle cx="78" cy="174" r="9" fill="#263238"/><circle cx="78" cy="174" r="5" fill="#37474f"/>
  <circle cx="122" cy="174" r="9" fill="#263238"/><circle cx="122" cy="174" r="5" fill="#37474f"/>
  <!-- Main body -->
  <rect x="55" y="120" width="90" height="42" rx="6" fill="#455a64"/>
  <rect x="60" y="124" width="80" height="34" rx="4" fill="#546e7a"/>
  <!-- Hydraulic cylinder -->
  <rect x="80" y="72" width="40" height="52" rx="4" fill="#607d8b"/>
  <rect x="84" y="76" width="32" height="44" rx="3" fill="#78909c"/>
  <!-- Lifting arm -->
  <rect x="70" y="60" width="60" height="16" rx="5" fill="#455a64"/>
  <rect x="75" y="63" width="50" height="10" rx="3" fill="#546e7a"/>
  <!-- Saddle -->
  <ellipse cx="100" cy="58" rx="32" ry="10" fill="#37474f"/>
  <ellipse cx="100" cy="56" rx="28" ry="7" fill="#607d8b"/>
  <!-- Release valve -->
  <circle cx="155" cy="138" r="10" fill="#263238"/>
  <circle cx="155" cy="138" r="7" fill="#e53935"/>
  <rect x="151" y="132" width="8" height="4" rx="2" fill="#b71c1c"/>
  <!-- Handle socket -->
  <rect x="28" y="134" width="30" height="8" rx="4" fill="#37474f"/>
  <circle cx="28" cy="138" r="5" fill="#263238"/>
  <!-- Capacity label -->
  <rect x="70" y="130" width="60" height="20" rx="4" fill="#263238"/>
  <text x="100" y="138" text-anchor="middle" font-family="Arial" font-size="7" fill="#64ffda">2 TON</text>
  <text x="100" y="148" text-anchor="middle" font-family="Arial" font-size="6" fill="#8892b0">HIDRÁULICO</text>
  <text x="100" y="195" text-anchor="middle" font-family="Arial" font-size="10" fill="#ff4d4d">⚠ PERDIDO · 2 Toneladas</text>
</svg>
