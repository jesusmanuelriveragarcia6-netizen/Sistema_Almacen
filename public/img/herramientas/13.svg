<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="16" fill="#0a192f"/>
  <text x="100" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#64ffda" font-weight="bold">NIVEL LÁSER BOSCH</text>
  <!-- Device body -->
  <rect x="60" y="70" width="80" height="80" rx="10" fill="#1565c0"/>
  <rect x="65" y="75" width="70" height="70" rx="7" fill="#1976d2"/>
  <!-- Laser emitters -->
  <circle cx="100" cy="95" r="8" fill="#e3f2fd"/>
  <circle cx="100" cy="95" r="5" fill="#bbdefb"/>
  <circle cx="100" cy="95" r="3" fill="#e53935"/>
  <!-- Laser beams horizontal -->
  <line x1="20" y1="95" x2="60" y2="95" stroke="#f44336" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>
  <line x1="140" y1="95" x2="180" y2="95" stroke="#f44336" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>
  <!-- Laser beams vertical -->
  <line x1="100" y1="20" x2="100" y2="70" stroke="#f44336" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>
  <line x1="100" y1="150" x2="100" y2="178" stroke="#f44336" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>
  <!-- Glow dots at ends -->
  <circle cx="20" cy="95" r="3" fill="#f44336" opacity="0.6"/>
  <circle cx="180" cy="95" r="3" fill="#f44336" opacity="0.6"/>
  <circle cx="100" cy="20" r="3" fill="#f44336" opacity="0.6"/>
  <!-- Level bubble -->
  <rect x="72" y="118" width="56" height="18" rx="9" fill="#0d47a1"/>
  <ellipse cx="100" cy="127" rx="22" ry="7" fill="#1565c0"/>
  <circle cx="100" cy="127" r="5" fill="#4fc3f7"/>
  <circle cx="100" cy="127" r="2" fill="#e3f2fd"/>
  <!-- Bosch logo area -->
  <rect x="73" y="78" width="54" height="16" rx="4" fill="#0d47a1"/>
  <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="9" fill="white" font-weight="bold">BOSCH</text>
  <!-- Tripod mount -->
  <rect x="94" y="150" width="12" height="12" rx="3" fill="#546e7a"/>
  <text x="100" y="192" text-anchor="middle" font-family="Arial" font-size="10" fill="#8892b0">Líneas Cruzadas · 15m</text>
</svg>
